<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAC オプション工数計測</title>
  
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f5f7;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      font-size: 1.05rem;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .model-input-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .model-prefix {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2b6cb0;
    }
    .btn {
      padding: 10px 4px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      color: #2b6cb0;
      cursor: pointer;
    }
    .btn.selected {
      background: #3182ce;
      color: #fff;
      border-color: #3182ce;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .add-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-group input { margin-top: 0; }
    .btn-add {
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 16px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .option-list {
      margin-top: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .option-item {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .option-item input { margin-top: 0; }
    .btn-sm {
      padding: 8px 12px;
      font-size: 0.85rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-edit { background: #edf2f7; color: #2d3748; }
    .btn-del { background: #fed7d7; color: #9b2c2c; }
    .timer-display {
      font-size: 2.8rem;
      font-weight: bold;
      text-align: center;
      margin: 16px 0;
      font-family: monospace;
    }
    .controls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .sub-controls {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      flex: 1;
      padding: 12px 6px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }
    .btn-start { background-color: #38a169; }
    .btn-pause { background-color: #dd6b20; }
    .btn-stop { background-color: #e53e3e; }
    .btn-save { background-color: #3182ce; }
    .btn-clear { background-color: #718096; }
    
    .btn-action:disabled {
      background-color: #cbd5e0;
      cursor: not-allowed;
    }
    details summary {
      cursor: pointer;
      color: #4a5568;
      font-size: 0.9rem;
      font-weight: bold;
      margin-top: 10px;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      min-width: 500px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 8px;
      text-align: left;
      font-size: 0.85rem;
    }
    th { background-color: #edf2f7; }

    .summary-box-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .summary-box {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .summary-box .title {
      font-size: 0.8rem;
      color: #2b6cb0;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .summary-box .val {
      font-size: 1rem;
      font-weight: bold;
      font-family: monospace;
      color: #2d3748;
    }
  </style>
</head>
<body>

  <!-- 1. 機種入力（VAC-〇〇〇） -->
  <div class="card">
    <h2>1. 機種を入力 <span style="color: red; font-size: 0.8rem;">*必須</span></h2>
    <div class="model-input-container">
      <span class="model-prefix">VAC-</span>
      <input type="number" id="modelNumberInput" placeholder="数字を入力 (例: 100)" style="margin-top:0;">
    </div>
  </div>

  <!-- 2. 仕様区分選択（複数選択可能） -->
  <div class="card">
    <h2>2. 仕様区分を選択（複数可） <span style="color: red; font-size: 0.8rem;">*1つ以上必須</span></h2>
    <div class="grid-3" id="typeGroup">
      <button class="btn" onclick="toggleSpecType(this, '標準')">標準</button>
      <button class="btn" onclick="toggleSpecType(this, 'オプション')">オプション</button>
      <button class="btn" onclick="toggleSpecType(this, '付加仕様')">付加仕様</button>
    </div>
  </div>

  <!-- 3. 工程選択 -->
  <div class="card">
    <h2>3. 工程を選択 <span style="color: red; font-size: 0.8rem;">*必須</span></h2>
    <div class="grid-4" id="processGroup">
      <button class="btn" onclick="selectProcess(this, '加工')">加工</button>
      <button class="btn" onclick="selectProcess(this, '組み立て')">組み立て</button>
      <button class="btn" onclick="selectProcess(this, '検査')">検査</button>
      <button class="btn" onclick="selectProcess(this, '整備')">整備</button>
    </div>
  </div>

  <!-- 4. 詳細項目 & 個数選択 -->
  <div class="card">
    <h2>4. 詳細項目・個数を設定 <span style="color: red; font-size: 0.8rem;">*必須</span></h2>
    
    <label style="font-size: 0.85rem; font-weight: bold;">作業項目:</label>
    <select id="optionSelect">
      <option value="">-- 先に工程を選択してください --</option>
    </select>

    <div id="qtyContainer" style="display: none; margin-top: 12px;">
      <label style="font-size: 0.85rem; font-weight: bold; color: #2b6cb0;">個数:</label>
      <select id="qtySelect" onchange="toggleCustomQty(this.value)">
        <option value="1">1個</option>
        <option value="2">2個</option>
        <option value="3">3個</option>
        <option value="4">4個</option>
        <option value="5">5個</option>
        <option value="6">6個</option>
        <option value="7">7個</option>
        <option value="8">8個</option>
        <option value="9">9個</option>
        <option value="10">10個</option>
        <option value="custom">その他（直接入力）</option>
      </select>
      <input type="number" id="customQtyInput" placeholder="個数を入力（例: 15）" min="1" style="display: none; margin-top: 6px;">
    </div>

    <details id="manageArea" style="display: none; margin-top: 12px;">
      <summary>⚙️ 作業項目の追加・編集</summary>
      <div class="add-group">
        <input type="text" id="newOptionInput" placeholder="新しい項目名">
        <button class="btn-add" onclick="addOption()">追加</button>
      </div>
      <div class="option-list" id="optionEditList"></div>
    </details>
  </div>

  <!-- 5. タイマー操作 & 集計 -->
  <div class="card">
    <div class="timer-display" id="display">00:00:00</div>
    
    <div class="controls">
      <button id="startBtn" class="btn-action btn-start" onclick="startTimer()">スタート</button>
      <button id="pauseBtn" class="btn-action btn-pause" onclick="pauseTimer()" disabled>一時停止</button>
      <button id="stopBtn" class="btn-action btn-stop" onclick="stopTimer()" disabled>計測終了</button>
    </div>

    <div class="sub-controls">
      <button class="btn-action btn-save" onclick="exportCSV()">📁 保存 (CSV)</button>
      <button class="btn-action btn-clear" onclick="clearSummaryData()">🗑️ 全リセット</button>
    </div>
  </div>

  <!-- 6. 仕様区分別 合計時間 ＆ 計測結果一覧 -->
  <div class="card">
    <h2>⏱️ 仕様区分ごとの合計時間</h2>
    <div class="summary-box-group">
      <div class="summary-box">
        <div class="title">標準 合計</div>
        <div class="val" id="totalStandard">00:00:00</div>
      </div>
      <div class="summary-box">
        <div class="title">オプション 合計</div>
        <div class="val" id="totalOption">00:00:00</div>
      </div>
      <div class="summary-box">
        <div class="title">付加仕様 合計</div>
        <div class="val" id="totalExtra">00:00:00</div>
      </div>
    </div>

    <h2>📊 計測結果履歴</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>機種</th>
            <th>区分</th>
            <th>工程</th>
            <th>作業項目</th>
            <th>個数</th>
            <th>時間</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td colspan="6" style="text-align:center; color:#a0aec0;">計測データはまだありません</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let timer;
    let seconds = 0;
    let isRunning = false;
    
    let selectedSpecTypes = [];
    let selectedProcessName = "";

    let timerRecords = JSON.parse(localStorage.getItem('vac_timer_records_v1')) || [];

    const optionsData = {
      "加工": ["内装加工", "バリ取り", "穴あけ"],
      "組み立て": ["パネル取付", "パーツ固定", "ネジ締め"],
      "検査": ["外観チェック", "動作確認"],
      "整備": ["清掃", "点検", "注油"]
    };

    window.onload = function() {
      renderSummaryTable();
    };

    function saveToStorage() {
      localStorage.setItem('vac_timer_records_v1', JSON.stringify(timerRecords));
    }

    function getSelectedModel() {
      const num = document.getElementById('modelNumberInput').value.trim();
      return num ? `VAC-${num}` : "";
    }

    // 複数選択用のトグル処理
    function toggleSpecType(element, specType) {
      element.classList.toggle('selected');
      if (selectedSpecTypes.includes(specType)) {
        selectedSpecTypes = selectedSpecTypes.filter(t => t !== specType);
      } else {
        selectedSpecTypes.push(specType);
      }
    }

    function selectProcess(element, processName) {
      document.querySelectorAll('#processGroup .btn').forEach(b => b.classList.remove('selected'));
      element.classList.add('selected');
      selectedProcessName = processName;

      const qtyContainer = document.getElementById('qtyContainer');
      if (processName === '加工' || processName === '整備') {
        qtyContainer.style.display = 'block';
      } else {
        qtyContainer.style.display = 'none';
      }

      document.getElementById('manageArea').style.display = 'block';
      renderOptions();
    }

    function toggleCustomQty(val) {
      const customInput = document.getElementById('customQtyInput');
      if (val === 'custom') {
        customInput.style.display = 'block';
      } else {
        customInput.style.display = 'none';
      }
    }

    function renderOptions() {
      if (!selectedProcessName) return;

      const select = document.getElementById('optionSelect');
      const editList = document.getElementById('optionEditList');
      const list = optionsData[selectedProcessName] || [];

      select.innerHTML = '<option value="">-- 作業項目を選択 --</option>';
      list.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        select.appendChild(option);
      });

      editList.innerHTML = '';
      list.forEach((opt, index) => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML = `
          <input type="text" value="${opt}" id="edit-opt-${index}">
          <button class="btn-sm btn-edit" onclick="updateOption(${index})">保存</button>
          <button class="btn-sm btn-del" onclick="deleteOption(${index})">削除</button>
        `;
        editList.appendChild(div);
      });
    }

    function addOption() {
      const input = document.getElementById('newOptionInput');
      const val = input.value.trim();
      if (!val || !selectedProcessName) return;

      if (!optionsData[selectedProcessName]) {
        optionsData[selectedProcessName] = [];
      }
      optionsData[selectedProcessName].push(val);
      input.value = '';
      renderOptions();
    }

    function updateOption(index) {
      const input = document.getElementById(`edit-opt-${index}`);
      const val = input.value.trim();
      if (!val || !selectedProcessName) return;

      optionsData[selectedProcessName][index] = val;
      renderOptions();
    }

    function deleteOption(index) {
      if (!selectedProcessName) return;
      optionsData[selectedProcessName].splice(index, 1);
      renderOptions();
    }

    function formatTime(sec) {
      const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const secs = String(sec % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function updateDisplay() {
      document.getElementById('display').textContent = formatTime(seconds);
    }

    function startTimer() {
      if (!isRunning) {
        const missing = [];
        const currentModel = getSelectedModel();

        if (!currentModel) missing.push("1. 機種 (VAC-の後の数字)");
        if (selectedSpecTypes.length === 0) missing.push("2. 仕様区分 (1つ以上選択)");
        if (!selectedProcessName) missing.push("3. 工程");
        
        const selectedOption = document.getElementById('optionSelect').value;
        if (!selectedOption) missing.push("4. 作業項目");

        if (missing.length > 0) {
          alert("計測を開始するには、以下の項目をすべて選択・入力してください：\n\n・" + missing.join("\n・"));
          return;
        }

        isRunning = true;
        timer = setInterval(() => {
          seconds++;
          updateDisplay();
        }, 1000);

        document.getElementById('startBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = false;
        document.getElementById('stopBtn').disabled = false;
      }
    }

    function pauseTimer() {
      if (isRunning) {
        isRunning = false;
        clearInterval(timer);

        document.getElementById('startBtn').disabled = false;
        document.getElementById('startBtn').textContent = '再開';
        document.getElementById('pauseBtn').disabled = true;
      }
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timer);

      const model = getSelectedModel();
      const specTypes = [...selectedSpecTypes];
      const process = selectedProcessName;
      const option = document.getElementById('optionSelect').value;

      let qty = "-";
      if (process === '加工' || process === '整備') {
        const qtyVal = document.getElementById('qtySelect').value;
        if (qtyVal === 'custom') {
          qty = (document.getElementById('customQtyInput').value || "1") + "個";
        } else {
          qty = qtyVal + "個";
        }
      }

      timerRecords.push({
        model: model,
        specType: specTypes.join('・'),
        specTypesArray: specTypes,
        process: process,
        option: option,
        qty: qty,
        duration: seconds,
        timeStr: formatTime(seconds)
      });

      saveToStorage();
      renderSummaryTable();

      seconds = 0;
      updateDisplay();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = 'スタート';
      document.getElementById('pauseBtn').disabled = true;
      document.getElementById('stopBtn').disabled = true;
    }

    function renderSummaryTable() {
      const tbody = document.getElementById('summaryTableBody');
      tbody.innerHTML = '';

      let secStandard = 0;
      let secOption = 0;
      let secExtra = 0;

      if (timerRecords.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#a0aec0;">計測データはまだありません</td></tr>';
      } else {
        timerRecords.slice().reverse().forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.model}</td>
            <td>${item.specType}</td>
            <td>${item.process}</td>
            <td><strong>${item.option}</strong></td>
            <td>${item.qty}</td>
            <td><strong>${item.timeStr}</strong></td>
          `;
          tbody.appendChild(tr);
        });

        timerRecords.forEach(item => {
          const arr = item.specTypesArray || (item.specType ? item.specType.split('・') : []);
          if (arr.includes('標準')) secStandard += item.duration;
          if (arr.includes('オプション')) secOption += item.duration;
          if (arr.includes('付加仕様')) secExtra += item.duration;
        });
      }

      document.getElementById('totalStandard').textContent = formatTime(secStandard);
      document.getElementById('totalOption').textContent = formatTime(secOption);
      document.getElementById('totalExtra').textContent = formatTime(secExtra);
    }

    function exportCSV() {
      if (timerRecords.length === 0) {
        alert("保存するデータがありません");
        return;
      }

      let secStandard = 0;
      let secOption = 0;
      let secExtra = 0;

      timerRecords.forEach(item => {
        const arr = item.specTypesArray || (item.specType ? item.specType.split('・') : []);
        if (arr.includes('標準')) secStandard += item.duration;
        if (arr.includes('オプション')) secOption += item.duration;
        if (arr.includes('付加仕様')) secExtra += item.duration;
      });

      let csvContent = "\uFEFF【VAC 個別計測履歴】\n";
      csvContent += "機種,仕様区分,工程,作業項目,個数,作業時間\n";
      timerRecords.forEach(item => {
        csvContent += `"${item.model}","${item.specType}","${item.process}","${item.option}","${item.qty}","${item.timeStr}"\n`;
      });

      csvContent += "\n【仕様区分別 合計時間】\n";
      csvContent += "仕様区分,合計作業時間\n";
      csvContent += `"標準","${formatTime(secStandard)}"\n`;
      csvContent += `"オプション","${formatTime(secOption)}"\n`;
      csvContent += `"付加仕様","${formatTime(secExtra)}"\n`;

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VAC工数記録_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearSummaryData() {
      if (confirm("これまでの計測結果データ（履歴と合計）をすべてリセットしてもよろしいですか？")) {
        timerRecords = [];
        localStorage.removeItem('vac_timer_records_v1');
        renderSummaryTable();
      }
    }
  </script>
</body>
</html>
