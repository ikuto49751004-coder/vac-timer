<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAC オプション工数計測</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f5f7;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .btn {
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      color: #2b6cb0;
      cursor: pointer;
    }
    .btn.selected {
      background: #3182ce;
      color: #fff;
      border-color: #3182ce;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .add-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-group input { margin-top: 0; }
    .btn-add {
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 16px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .option-list {
      margin-top: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .option-item {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .option-item input { margin-top: 0; }
    .btn-sm {
      padding: 8px 12px;
      font-size: 0.85rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-edit { background: #edf2f7; color: #2d3748; }
    .btn-del { background: #fed7d7; color: #9b2c2c; }
    .timer-display {
      font-size: 2.8rem;
      font-weight: bold;
      text-align: center;
      margin: 16px 0;
      font-family: monospace;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .btn-action {
      flex: 1;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }
    .btn-start { background-color: #38a169; }
    .btn-pause { background-color: #dd6b20; }
    .btn-stop { background-color: #e53e3e; }
    .btn-action:disabled {
      background-color: #cbd5e0;
      cursor: not-allowed;
    }
    details summary {
      cursor: pointer;
      color: #4a5568;
      font-size: 0.9rem;
      font-weight: bold;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: left;
      font-size: 0.9rem;
    }
    th { background-color: #edf2f7; }
    
    /* 保存・リセットボタン用 */
    .table-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-save {
      background-color: #3182ce;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-clear {
      background-color: #e53e3e;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- 1. 工程選択 -->
  <div class="card">
    <h2>1. 工程を選択</h2>
    <div class="grid">
      <button class="btn" onclick="selectProcess(this, '加工')">加工</button>
      <button class="btn" onclick="selectProcess(this, '組み立て')">組み立て</button>
      <button class="btn" onclick="selectProcess(this, '検査')">検査</button>
      <button class="btn" onclick="selectProcess(this, '整備')">整備</button>
    </div>
  </div>

  <!-- 2. オプション選択・編集 -->
  <div class="card">
    <h2>2. オプションを選択</h2>
    <select id="optionSelect">
      <option value="">-- 先に工程を選択してください --</option>
    </select>

    <details id="manageArea" style="display: none;">
      <summary>⚙️ オプションの追加・編集</summary>
      <div class="add-group">
        <input type="text" id="newOptionInput" placeholder="新しいオプション名">
        <button class="btn-add" onclick="addOption()">追加</button>
      </div>
      <div class="option-list" id="optionEditList"></div>
    </details>
  </div>

  <!-- 3. タイマー操作 -->
  <div class="card">
    <div class="timer-display" id="display">00:00:00</div>
    <div class="controls">
      <button id="startBtn" class="btn-action btn-start" onclick="startTimer()">スタート</button>
      <button id="pauseBtn" class="btn-action btn-pause" onclick="pauseTimer()" disabled>一時停止</button>
      <button id="stopBtn" class="btn-action btn-stop" onclick="stopTimer()" disabled>計測終了</button>
    </div>
  </div>

  <!-- 4. 集計結果 & 保存・リセットボタン -->
  <div class="card">
    <h2>📊 オプション別 合計工数</h2>
    <table>
      <thead>
        <tr>
          <th>オプション名</th>
          <th>内訳（工程）</th>
          <th>合計時間</th>
        </tr>
      </thead>
      <tbody id="summaryTableBody">
        <tr>
          <td colspan="3" style="text-align:center; color:#a0aec0;">計測データはまだありません</td>
        </tr>
      </tbody>
    </table>

    <div class="table-actions">
      <button class="btn-save" onclick="exportCSV()">📁 CSVで保存</button>
      <button class="btn-clear" onclick="clearSummaryData()">🗑️ リセット</button>
    </div>
  </div>

  <script>
    let timer;
    let seconds = 0;
    let isRunning = false;
    let selectedProcessName = "";

    // ローカルストレージから保存済みデータを復元
    let optionSummary = JSON.parse(localStorage.getItem('vac_timer_summary')) || {};

    const optionsData = {
      "加工": ["内装", "バリ取り", "穴あけ"],
      "組み立て": ["内装", "パーツ固定", "ネジ締め"],
      "検査": ["外観チェック", "動作確認"],
      "整備": ["清掃", "注油"]
    };

    window.onload = function() {
      renderSummaryTable();
    };

    function saveToStorage() {
      localStorage.setItem('vac_timer_summary', JSON.stringify(optionSummary));
    }

    function selectProcess(element, processName) {
      document.querySelectorAll('.grid .btn').forEach(b => b.classList.remove('selected'));
      element.classList.add('selected');
      selectedProcessName = processName;

      document.getElementById('manageArea').style.display = 'block';
      renderOptions();
    }

    function renderOptions() {
      if (!selectedProcessName) return;

      const select = document.getElementById('optionSelect');
      const editList = document.getElementById('optionEditList');
      const list = optionsData[selectedProcessName] || [];

      select.innerHTML = '<option value="">-- オプションを選択 --</option>';
      list.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        select.appendChild(option);
      });

      editList.innerHTML = '';
      list.forEach((opt, index) => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML = `
          <input type="text" value="${opt}" id="edit-opt-${index}">
          <button class="btn-sm btn-edit" onclick="updateOption(${index})">保存</button>
          <button class="btn-sm btn-del" onclick="deleteOption(${index})">削除</button>
        `;
        editList.appendChild(div);
      });
    }

    function addOption() {
      const input = document.getElementById('newOptionInput');
      const val = input.value.trim();
      if (!val || !selectedProcessName) return;

      optionsData[selectedProcessName].push(val);
      input.value = '';
      renderOptions();
    }

    function updateOption(index) {
      const input = document.getElementById(`edit-opt-${index}`);
      const val = input.value.trim();
      if (!val || !selectedProcessName) return;

      optionsData[selectedProcessName][index] = val;
      renderOptions();
    }

    function deleteOption(index) {
      if (!selectedProcessName) return;
      optionsData[selectedProcessName].splice(index, 1);
      renderOptions();
    }

    function formatTime(sec) {
      const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const secs = String(sec % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function updateDisplay() {
      document.getElementById('display').textContent = formatTime(seconds);
    }

    function startTimer() {
      if (!isRunning) {
        isRunning = true;
        timer = setInterval(() => {
          seconds++;
          updateDisplay();
        }, 1000);

        document.getElementById('startBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = false;
        document.getElementById('stopBtn').disabled = false;
      }
    }

    function pauseTimer() {
      if (isRunning) {
        isRunning = false;
        clearInterval(timer);

        document.getElementById('startBtn').disabled = false;
        document.getElementById('startBtn').textContent = '再開';
        document.getElementById('pauseBtn').disabled = true;
      }
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timer);

      const process = selectedProcessName || "未選択";
      const option = document.getElementById('optionSelect').value || "未選択";

      if (!optionSummary[option]) {
        optionSummary[option] = { totalSec: 0, processes: [] };
      }
      optionSummary[option].totalSec += seconds;
      if (!optionSummary[option].processes.includes(process)) {
        optionSummary[option].processes.push(process);
      }

      saveToStorage();
      renderSummaryTable();

      seconds = 0;
      updateDisplay();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = 'スタート';
      document.getElementById('pauseBtn').disabled = true;
      document.getElementById('stopBtn').disabled = true;
    }

    function renderSummaryTable() {
      const tbody = document.getElementById('summaryTableBody');
      tbody.innerHTML = '';

      const keys = Object.keys(optionSummary);
      if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#a0aec0;">計測データはまだありません</td></tr>';
        return;
      }

      keys.forEach(optKey => {
        const item = optionSummary[optKey];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${optKey}</strong></td>
          <td>${item.processes.join(', ')}</td>
          <td><strong>${formatTime(item.totalSec)}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportCSV() {
      if (Object.keys(optionSummary).length === 0) {
        alert("保存するデータがありません");
        return;
      }

      let csvContent = "\uFEFFオプション名,内訳（工程）,合計時間\n";
      Object.keys(optionSummary).forEach(optKey => {
        const item = optionSummary[optKey];
        const processes = `"${item.processes.join(', ')}"`;
        csvContent += `${optKey},${processes},${formatTime(item.totalSec)}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VAC工数計測結果_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearSummaryData() {
      if (confirm("これまでの合計工数データをリセットしてもよろしいですか？")) {
        optionSummary = {};
        localStorage.removeItem('vac_timer_summary');
        renderSummaryTable();
      }
    }
  </script>
</body>
</html>
